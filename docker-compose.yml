# Production-like stack: PostgreSQL + ResolveIQ (frontend and API built from source in one image).
#   docker compose up --build
# App: http://localhost:8080
# Secrets below are for local use only; a real deployment sets its own (see docs/DEPLOYMENT.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resolveiq
      POSTGRES_USER: resolveiq
      POSTGRES_PASSWORD: resolveiq
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveiq -d resolveiq"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      ITSM_DB_URL: jdbc:postgresql://db:5432/resolveiq
      ITSM_DB_USERNAME: resolveiq
      ITSM_DB_PASSWORD: resolveiq
      ITSM_JWT_SECRET: local-compose-jwt-secret-0123456789abcdef0123456789
      ITSM_DATA_KEY: local-compose-data-key-0123456789abcdef0123456789
      ITSM_PUBLIC_URL: http://localhost:8080
      ITSM_DEMO_MODE: "true"
      ITSM_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      # optional: Google sign-in (docs/DEPLOYMENT.md explains how to get these)
      ITSM_GOOGLE_CLIENT_ID: ${ITSM_GOOGLE_CLIENT_ID:-}
      ITSM_GOOGLE_CLIENT_SECRET: ${ITSM_GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
