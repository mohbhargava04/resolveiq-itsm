# Render "Blueprint": one click creates the web app and its PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repository. See docs/DEPLOYMENT.md.
databases:
  - name: resolveiq-db
    plan: free
    databaseName: resolveiq
    user: resolveiq

services:
  - type: web
    name: resolveiq
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: ITSM_DB_HOST
        fromDatabase: { name: resolveiq-db, property: host }
      - key: ITSM_DB_PORT
        fromDatabase: { name: resolveiq-db, property: port }
      - key: ITSM_DB_NAME
        fromDatabase: { name: resolveiq-db, property: database }
      - key: ITSM_DB_USERNAME
        fromDatabase: { name: resolveiq-db, property: user }
      - key: ITSM_DB_PASSWORD
        fromDatabase: { name: resolveiq-db, property: password }
      # random secrets generated by Render on first deploy, never stored in the repository
      - key: ITSM_JWT_SECRET
        generateValue: true
      - key: ITSM_DATA_KEY
        generateValue: true
      - key: ITSM_INBOUND_EMAIL_SECRET
        generateValue: true
      # Render terminates HTTPS in front of the app; trust its X-Forwarded-* headers so cookies are Secure
      - key: ITSM_FORWARD_HEADERS
        value: framework
      - key: ITSM_API_DOCS
        value: "false"
      # keep the demo accounts on the sign-in page for the project evaluation
      - key: ITSM_DEMO_MODE
        value: "true"
      - key: ITSM_RESET_DEMO
        value: "false"
      # set these two in the dashboard after the first deploy (sync: false = not in this file)
      - key: ITSM_PUBLIC_URL
        sync: false
      - key: ITSM_GOOGLE_CLIENT_ID
        sync: false
      - key: ITSM_GOOGLE_CLIENT_SECRET
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"
