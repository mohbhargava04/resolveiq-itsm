spring:
  application:
    name: resolveiq
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway migrations, Hibernate only validates it
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${ITSM_SMTP_HOST:}
    port: ${ITSM_SMTP_PORT:587}
    username: ${ITSM_SMTP_USERNAME:}
    password: ${ITSM_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  servlet:
    multipart:
      max-file-size: 5MB          # attachments; also enforced (with type checks) by AttachmentService
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  # behind a cloud load balancer (Render, Railway...) set ITSM_FORWARD_HEADERS=framework so the real
  # client address (rate limiting, sign-in log) and https (Secure cookies) are seen
  forward-headers-strategy: ${ITSM_FORWARD_HEADERS:none}
  error:
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true

management:
  health:
    mail:
      enabled: false   # SMTP is optional; an unconfigured mail server must not mark the app DOWN
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    enabled: ${ITSM_API_DOCS:true}
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

itsm:
  display-zone: ${ITSM_DISPLAY_ZONE:Asia/Kolkata}
  # where people reach the app; used in e-mailed links and the Google sign-in redirect address
  public-url: ${ITSM_PUBLIC_URL:http://localhost:8080}
  # shows one-click demo accounts on the sign-in page; set ITSM_DEMO_MODE=false for a real deployment
  demo-mode: ${ITSM_DEMO_MODE:true}
  security:
    # HMAC-SHA256 signing key for JWTs. Override with ITSM_JWT_SECRET in every real deployment.
    jwt-secret: ${ITSM_JWT_SECRET:resolveiq-dev-only-secret-change-me-0123456789abcdef}
    # AES key for secrets stored in the database (two-factor secrets). Override with ITSM_DATA_KEY.
    data-key: ${ITSM_DATA_KEY:resolveiq-dev-only-data-key-change-me-0123456789}
    token-validity-minutes: ${ITSM_TOKEN_VALIDITY_MINUTES:15}   # access token
    refresh-token-days: 7                                          # signed out after a week of inactivity
    session-max-days: 30                                           # and after 30 days regardless
    refresh-reuse-grace-seconds: 20
    max-failed-logins: 5
    lockout-minutes: 15
    bcrypt-strength: 12
    allowed-origins: ${ITSM_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    expose-dev-tools: ${ITSM_EXPOSE_DEV_TOOLS:false}             # Swagger UI / H2 console without sign-in
    rate-limit:
      enabled: ${ITSM_RATE_LIMIT:true}
  oauth:
    google:
      # create at https://console.cloud.google.com/apis/credentials (OAuth client ID, type "Web application")
      # authorised redirect URI: <public-url>/api/auth/oauth/google/callback
      client-id: ${ITSM_GOOGLE_CLIENT_ID:}
      client-secret: ${ITSM_GOOGLE_CLIENT_SECRET:}
  inbound-email:
    # shared secret the mail provider sends in the X-Inbound-Secret header; empty = endpoint disabled
    secret: ${ITSM_INBOUND_EMAIL_SECRET:}
    address: ${ITSM_INBOUND_EMAIL_ADDRESS:support@resolveiq.test}
  sla:
    monitor-enabled: true
    monitor-interval-ms: ${ITSM_SLA_MONITOR_INTERVAL_MS:30000}
  notifications:
    # Channels switched on at runtime. EMAIL uses SMTP when spring.mail.host is set, otherwise it is simulated.
    enabled-channels: IN_APP,EMAIL,SMS
    from-address: ${ITSM_MAIL_FROM:no-reply@resolveiq.test}
  intelligence:
    duplicate-suspect-threshold: 0.45
    duplicate-block-threshold: 0.85
    duplicate-window-hours: 72
    correlation-window-minutes: 60
    correlation-min-incidents: 3
  seed:
    enabled: ${ITSM_SEED_ENABLED:true}
    # true = wipe the database and rebuild the demo scenario on every start (use when recording demos)
    reset-on-start: ${ITSM_RESET_DEMO:false}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/resolveiq;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

itsm:
  security:
    expose-dev-tools: ${ITSM_EXPOSE_DEV_TOOLS:true}   # local development only

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    # either a full JDBC URL, or the parts (cloud hosts such as Render hand these out separately)
    url: ${ITSM_DB_URL:jdbc:postgresql://${ITSM_DB_HOST:localhost}:${ITSM_DB_PORT:5432}/${ITSM_DB_NAME:resolveiq}}
    username: ${ITSM_DB_USERNAME:resolveiq}
    password: ${ITSM_DB_PASSWORD:resolveiq}
